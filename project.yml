name: CoastlineRush
options:
  bundleIdPrefix: studio.coastline
  deploymentTarget:
    iOS: '16.0'
    macOS: '13.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '7.0.0'
    CURRENT_PROJECT_VERSION: '7'
    PRODUCT_NAME: Coastline Rush
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    INFOPLIST_KEY_CFBundleDisplayName: Coastline Rush
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
targets:
  CoastlineRush-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.coastline.rush
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIStatusBarHidden: YES
  CoastlineRush-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.coastline.rush.mac
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
schemes:
  CoastlineRush-iOS:
    build:
      targets:
        CoastlineRush-iOS: all
  CoastlineRush-macOS:
    build:
      targets:
        CoastlineRush-macOS: all
